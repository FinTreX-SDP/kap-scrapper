# Forward proxy for the scrapers only: setup.sh puts the default VPC's range in place of VPC_CIDR, and the
# security group lets only the scraper tasks reach port 3128.
http_port 3128
acl scrapers src VPC_CIDR
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow scrapers
http_access deny all
cache deny all
forwarded_for delete
access_log none
pid_filename none
shutdown_lifetime 1 seconds
